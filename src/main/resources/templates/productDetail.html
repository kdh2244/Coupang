<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상품 상세</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f8f9fa;
        }

        .product-image{
            width:100%;
            height:500px;
            object-fit:cover;
            border-radius:10px;
            background:#ececec;
        }

        .price{
            color:#d63384;
            font-size:32px;
            font-weight:bold;
        }

        .info-box{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.08);
        }

        .detail-box{
            margin-top:50px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.08);
        }

        .buy-btn{
            width:100%;
            height:55px;
        }

        .cart-btn{
            width:100%;
            height:55px;
        }

    </style>

</head>
<body>

<div class="container mt-5">
    <div class="mb-6">
        <a th:href ="@{/home}" class="logo">My Shop</a>
    </div>
            <div class="row">


                <!-- 상품 이미지 -->
                <div class="col-md-6">

        <!--            <img-->
        <!--                    th:src="${product?.imageUrl}"-->
        <!--                    class="product-image">-->

                </div>

            <!-- 상품 정보 -->

                <div class="col-md-6">

                    <div class="info-box">

                        <h2 th:text="${product.name}">
                            상품명
                        </h2>

                        <hr>

                        <div class="price"
                             th:text="${#numbers.formatInteger(product.price,3,'COMMA')} + '원'">
                        </div>

                        <p class="mt-4 text-secondary"
                           th:text="${product.description}">
                            상품 설명
                        </p>

                        <hr>

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                재고
                            </label>

                            <div th:text="${product.stock} + '개'">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                수량
                            </label>

                            <input
                                    id="inputCount"
                                    type="number"
                                    name="count"
                                    value="1"
                                    min="1"
                                    th:max="${product.stock}"
                                    class="form-control"/>

                        </div>

                        <div class="mb-4">

                            <h4>
                                총 금액 :
                                <span class="text-danger" id="totalPrice"
                                      th:text="${#numbers.formatInteger(product.price,3,'COMMA')} + '원'">
                                </span>
                            </h4>

                        </div>

                        <div class="row">

                            <form th:action="@{/order/cart}" method="post">
                                <div class="col-6">

                                    <input type="hidden" th:value="${product.id}" name="id"/>
                                    <input type="hidden"  name="count" id="cartSubmitCount"/>
                                    <button id="cartBtn" type="submit" class="btn btn-outline-primary cart-btn">
                                        장바구니
                                    </button>

                                </div>
                            </form>
                            <form th:action="@{/order/showOrderPage}" method="post">
                                <div class="col-6">
                                        <input type="hidden"
                                               name="count"
                                               id="submitCount"
                                               th:value="${count}"/>
                                        <input type="hidden"
                                               name="id"
                                               th:value="${product.id}"/>
                                        <input type="hidden"
                                               name="name"
                                               th:value="${product.name}"/>
                                        <input type="hidden"
                                               name="price"
                                               th:value="${product.price}"/>
                                        <input type="hidden"
                                               name="description"
                                               th:value="${product.description}"/>
                                        <input type="hidden"
                                               name="stock"
                                               th:value="${product.stock}"/>
                                        <button id="orderBtn" type="submit" class="btn btn-danger buy-btn">
                                            구매하기
                                        </button>


                                </div>
                            </form>
                        </div>

                    </div>

                </div>
            </div>

    </div>

    <!-- 상세 설명 -->

    <div class="detail-box">

        <h3>
            상품 상세
        </h3>

        <hr>

        <p th:text="${product.description}">
            상세 설명
        </p>

        <br>

        <p>
            ✔ 정품 보증<br>
            ✔ 무료 배송<br>
            ✔ 7일 교환 및 환불 가능
        </p>

    </div>

</div>

    <script th:inline="javascript">
        const price = [[${product.price}]];
        var inputCount = document.getElementById("inputCount");
        var totalPrice = document.getElementById("totalPrice");
        var submitCount = document.getElementById("submitCount");
        var cartSubmitCount = document.getElementById("cartSubmitCount");

        inputCount.addEventListener("input",function(){
            const count = inputCount.value;
            totalPrice.textContent = (price * count).toLocaleString();
        });


        var cartBtn = document.getElementById("cartBtn");
        cartBtn.addEventListener("click",function(){
            console.log("go");
            cartSubmitCount.value = inputCount.value;
        });

        var orderBtn = document.getElementById("orderBtn");
        orderBtn.addEventListener("click",function(){
            submitCount.value = inputCount.value;
        });

    </script>



</body>
</html>
