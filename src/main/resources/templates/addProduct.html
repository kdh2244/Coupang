<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>상품 추가</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <h2 class="text-center mb-4">상품 추가</h2>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/admin/add}" method="post">

                        <!-- 상품명 -->
                        <div class="mb-3">
                            <label for="name" class="form-label">상품명</label>
                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   name="name"
                                   placeholder="상품명을 입력하세요">
                        </div>

                        <!-- 가격 -->
                        <div class="mb-3">
                            <label for="price" class="form-label">가격</label>
                            <input type="number"
                                   class="form-control"
                                   id="price"
                                   name="price"
                                   placeholder="가격을 입력하세요">
                        </div>

                        <!-- 재고 -->
                        <div class="mb-3">
                            <label for="stock" class="form-label">재고</label>
                            <input type="number"
                                   class="form-control"
                                   id="stock"
                                   name="stock"
                                   placeholder="재고 수량을 입력하세요">
                        </div>

                        <!-- 상품 설명 -->
                        <div class="mb-3">
                            <label for="description" class="form-label">상품 설명</label>
                            <textarea class="form-control"
                                      id="description"
                                      name="description"
                                      rows="5"
                                      placeholder="상품 설명을 입력하세요"></textarea>
                        </div>

                        <!-- 카테고리 목록 -->
                        <div class="row g-3">
                            <div th:each = "category : ${categoryList}" class="col-md-3">
                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           id="category1"
                                           name="addCategoryIds"
                                           th:value="${category.id}">

                                    <label class="form-check-label"
                                           for="category1" th:text = "${category.name}">

                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- 버튼 -->
                        <div class="text-center mt-4">
                            <button type="submit"
                                    class="btn btn-primary px-5">
                                상품 추가
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
