<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }

        .login-box{
            max-width:420px;
            margin:100px auto;
            padding:40px;
            background:white;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
        }

        .login-title{
            font-size:30px;
            font-weight:bold;
            text-align:center;
            margin-bottom:30px;
        }

        .btn-login{
            width:100%;
        }

        .signup{
            text-align:center;
            margin-top:20px;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="login-box">

        <div class="login-title">
            Login
        </div>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label class="form-label">이메일</label>
                <input
                        type="text"
                        class="form-control"
                        name="username"
                        placeholder="이메일을 입력하세요">
            </div>

            <div class="mb-4">
                <label class="form-label">비밀번호</label>
                <input
                        type="password"
                        class="form-control"
                        name="password"
                        placeholder="비밀번호를 입력하세요">
            </div>

            <button class="btn btn-primary btn-login" type="submit">
                로그인
            </button>

        </form>

        <div class="signup">
            계정이 없으신가요?
            <a th:href="@{/signup}">회원가입</a>
        </div>

    </div>

</div>

</body>
</html>
