<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>구매하기</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
        }

        .logo{
            font-size:35px;
            font-weight:bold;
            color:#4285f4;
            text-decoration:none;
        }

        .box{
            background:white;
            border-radius:10px;
            padding:25px;
            margin-bottom:20px;
        }
    </style>

</head>


<body>

<div class="container mt-4">


    <!-- 로고 -->
    <div class="mb-5">
        <a th:href="@{/}" class="logo">
            MyShop
        </a>
    </div>



    <h3 class="mb-4">
        주문 / 결제
    </h3>



    <!-- 배송 정보 -->
    <div class="box shadow-sm">

        <h5 class="mb-4">
            배송 정보
        </h5>


        <div class="mb-3">
            <label class="form-label">
                받는 사람
            </label>

            <input type="text"
                   class="form-control"
                   th:value="${user.name}"/>
        </div>



        <div class="mb-3">
            <label class="form-label">
                배송 주소
            </label>

<!--            <input type="text"-->
<!--                   class="form-control"-->
<!--                   th:value="${user?.address}">-->
        </div>



        <div class="mb-3">
            <label class="form-label">
                전화번호
            </label>

<!--            <input type="text"-->
<!--                   class="form-control"-->
<!--                   th:value="${user?.phone}">-->
        </div>

    </div>




    <!-- 상품 정보 -->
    <div class="box shadow-sm">


        <h5 class="mb-4">
            상품 정보
        </h5>


        <div th:each = "productName,stat : ${productNames}">
            <div class="row align-items-center">


                <div class="col-md-8">


                    <h5 th:text="${productName}">
                        상품명
                    </h5>


                    <p>
                        개수 :
                        <span th:text="${productCounts[stat.index]}">
                            1
                        </span>
                    </p>


                </div>


                <div class="col-md-4 text-end">


                    <h5 class="text-danger fw-bold"
                        th:text="${#numbers.formatInteger({prices[stat.index]},3,'COMMA')} + '원'">

                        10,000원

                    </h5>


                </div>


            </div>
        </div>

    </div>





    <!-- 결제 버튼 -->
    <div class="text-end">
        <form th:action="@{/order/cartToOrderComplete}" method="post">
            <div th:each = "orderitem,stat : ${orderitems}">
                <input type="hidden" name="orderitems" th:value="${orderitem}"/>
                <input type="hidden" name="counts" th:value="${productCounts[stat.index]}"/>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">
                결제하기
            </button>
        </form>
    </div>


</div>


</body>

</html>
