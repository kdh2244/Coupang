<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>마이페이지</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="mb-6">
        <a th:href ="@{/home}" class="logo">My Shop</a>
    </div>
    <h2 class="mb-4">마이페이지</h2>

    <!-- 탭 -->
    <ul class="nav nav-tabs" id="myPageTab" role="tablist">

        <li class="nav-item" role="presentation">
            <button th:class="${mode == 'info' ? 'active nav-link' : 'nav-link'}"
                    id="info-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#info"
                    type="button"
                    role="tab">
                개인정보
            </button>
        </li>

        <li class="nav-item" role="presentation">
            <form method="get" th:action="@{/mypage/recentOrder}">
                <button th:class="${mode == 'order' ? 'active nav-link' : 'nav-link'}"
                        id="order-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#order"
                        type="submit"
                        role="tab">
                    최근 주문
                </button>
            </form>
        </li>

    </ul>



    <!-- 탭 내용 -->
    <div class="tab-content border border-top-0 p-4">

        <!-- 개인정보 -->
        <div
             th:class="${mode == 'info' ? 'ab-pane fade show active' : 'tab-pane fade'}"
             id="info"
             role="tabpanel">

            <h4 class="mb-4">개인정보 확인 및 수정</h4>

            <form th:action="@{/mypage/update}" method="post">

                <div class="mb-3">
                    <label for="name" class="form-label">이름</label>
                    <input type="text"
                           class="form-control"
                           id="name"
                           th:value="${ user != null ? user.name : ''}" name="name">
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">전화번호</label>
                    <input type="tel"
                           class="form-control"
                           id="phone"
                           th:value="${ user != null ? user.phone : ''}"
                           name="phone">
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">배송지</label>
                    <input type="text"
                           class="form-control"
                           id="address"
                           name="address"
                           th:value="${ user != null ? user.address : ''}">
                </div>

                <div class="text-end">

                        <button type="submit" class="btn btn-primary">
                            수정하기
                        </button>

                </div>

            </form>

        </div>


        <!-- 최근 주문 -->
        <div
             th:class="${mode == 'order' ? 'ab-pane fade show active' : 'tab-pane fade'}"
             id="order"
             role="tabpanel">

            <h4 class="mb-4">최근 주문</h4>

            <!-- 주문 목록 스크롤 영역 -->
            <div th:each = "orderitems : ${orderitemsList}" style="max-height: 600px; overflow-y: auto;">

                <!-- 주문 1건 -->
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between">
                        <span th:text = "${orderitems[0].order.orderDate}"></span>
                    </div>

                    <div class="card-body" th:each = "orderitem : ${orderitems}">
                        <!-- 상품 1 -->
                        <div class="d-flex align-items-center border-bottom pb-3 mb-3">

                            <img src="https://via.placeholder.com/100"
                                 class="rounded me-3"
                                 width="100"
                                 height="100"
                                 alt="상품">

                            <div class="flex-grow-1">
                                <h5 th:text="${orderitem.product.name}" class="mb-1">삼성 갤럭시북</h5>
                                <p th:text="${orderitem.count}" class="text-muted mb-1">수량: 1개</p>
                                <strong th:text="${orderitem.totalPrice}">1,250,000원</strong>
                            </div>

                            <div class="text-end">
                                <span th:if = "${orderitem.status == 'in transit'}"
                                        class="badge bg-primary">
                                    배송중
                                </span>
                                <span th:if = "${orderitem.status == 'ready'}"
                                        class="badge bg-secondary">
                                    배송 준비
                                </span>
                                <span th:if = "${orderitem.status == 'delivered'}"
                                        class="badge bg-success">
                                    배송완료
                                </span>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
