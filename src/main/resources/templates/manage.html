<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 모드</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container vh-100 d-flex flex-column justify-content-center align-items-center">

    <!-- 관리자 메뉴 -->
    <button id="adminMenuBtn"
            class="btn btn-dark btn-lg mb-3">
        관리자 메뉴
    </button>

    <!-- 관리자 메뉴 목록 -->
    <div id="adminMenuList"
         class="d-none flex-row gap-2">
        <form th:action="@{/admin/add}" method="get">
            <button  type="submit"  class="btn btn-primary">
                상품 추가
            </button>
        </form>
        <form th:action="@{/admin/edit/search}" method="post">
            <input type="hidden" name="pageNumber" value="0" />
            <input type="hidden" name="keyword" value=""/>
            <input type="hidden" name="categoryId" value=""/>
            <button class="btn btn-primary">
                상품 관리
            </button>
        </form>

        <button class="btn btn-primary">
            회원 관리
        </button>

    </div>

</div>

<script>
    const adminMenuBtn = document.getElementById("adminMenuBtn");
    const adminMenuList = document.getElementById("adminMenuList");

    adminMenuBtn.addEventListener("click", function () {
        adminMenuList.classList.toggle("d-none");
        adminMenuList.classList.toggle("d-flex");
    });
</script>

</body>
</html>
