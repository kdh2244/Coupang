<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <style>
        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f5f5f5;
            font-family:Arial, sans-serif;
        }

        .container{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            background:#4CAF50;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#45a049;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>회원가입</h2>

    <form th:action="@{/signup}" method="post">

        <div class="form-group">
            <label>이름</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>이메일</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit">회원가입</button>

    </form>

</div>

</body>
</html>
