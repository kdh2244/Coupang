<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>검색 결과</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
        }

        .logo{
            font-size:35px;
            font-weight:bold;
            color:#4285f4;
            text-decoration:none;
        }

        .search-input{
            border:2px solid #4285f4;
            border-right:none;
            height:50px;
        }

        .search-btn{
            border:2px solid #4285f4;
            background:#4285f4;
            color:white;
        }

        .product-card{
            transition:0.2s;
        }

        .product-card:hover{
            transform:translateY(-4px);
            box-shadow:0 4px 15px rgba(0,0,0,.15);
        }

        .product-image{
            height:220px;
            object-fit:cover;
        }
    </style>

</head>
<body>

<div class="container mt-4">

    <!-- 상단 검색 -->
    <div class="row mb-5">

        <div class="col-md-2">
            <a th:href="@{/}" class="logo">
                MyShop
            </a>
        </div>

        <div class="col-md-10">

            <form th:action="@{/product/search}" method="get">

                <div class="input-group">

                    <!-- 카테고리 버튼 -->
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle"
                                id="categoryBtn"
                                type="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                            카테고리
                        </button>

                        <ul  class="dropdown-menu">
                            <li th:each = "category : ${categoryList}"
                                th:class = "categoryLi"><a class="dropdown-item" th:data-id = "${category.id}" th:text="${category.name}"></a>
                            </li>
                            <input id="transCategory"  type="hidden" name="categoryId" />
                        </ul>
                    </div>

                    <input type="text"
                           name="keyword"
                           class="form-control search-input"
                           th:value="${keyword}"
                           placeholder="상품 검색">
                    <input type="hidden"
                           name="page"
                           class="form-control search-input"
                           th:value="${0}">

                    <button class="btn search-btn">
                        검색
                    </button>

                    <a th:href="@{/order/cart}" class="btn btn-outline-primary ms-2">
                        🛒 장바구니
                    </a>
                    <a th:href="@{/mypage}" class="btn btn-outline-primary ms-2">
                        마이페이지
                    </a>

                </div>

            </form>

        </div>

    </div>

    <h4 class="mb-4">
        '<span th:text="${keyword}"></span>' 검색 결과
    </h4>

    <div class="row g-4">

        <div class="col-lg-3 col-md-4 col-sm-6"
             th:each="product : ${products?.content}">
            <a th:href="@{/product/detail(id=${product.id})}" class="text-decoration-none text-dark">
                <div class="card product-card h-100">

                    <!--                <img th:src="${product?.imageUrl}"-->
                    <!--                     class="card-img-top product-image">-->

                    <div class="card-body">

                        <h5 class="card-title"
                            th:text="${product.name}">
                        </h5>

                        <p class="text-danger fw-bold"
                           th:text="${#numbers.formatInteger(product.price,3,'COMMA')} + '원'">
                        </p>

                    </div>
                </div>
            </a>
        </div>

    </div>

    <!-- 검색 결과 없을 때 -->
    <div class="text-center mt-5"
         th:if="${products?.totalElements == 0}">
        <h5>검색 결과가 없습니다.</h5>
    </div>

    <!-- 페이지 -->
    <nav class="mt-5"
         th:if="${products?.totalPages > 1}">

        <ul class="pagination justify-content-center">

            <!-- 이전 -->
            <li class="page-item"
                th:classappend="${products?.first}? 'disabled'">

                <a class="page-link"
                   th:href="@{/product/search(keyword=${keyword},page=${products?.number-1}, categoryId=${currentCategoryId})}">
                    이전
                </a>

            </li>

            <!-- 페이지 번호 -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, products.totalPages-1)}"
                th:classappend="${i==products.number}? 'active'">

                <a class="page-link"
                   th:text="${i+1}"
                   th:href="@{/product/search(keyword=${keyword},page=${i}, categoryId=${currentCategoryId})}">
                </a>

            </li>

            <!-- 다음 -->
            <li class="page-item"
                th:classappend="${products.last}? 'disabled'">

                <a class="page-link"
                   th:href="@{/product/search(keyword=${keyword},page=${products.number+1}, categoryId=${currentCategoryId})}">
                    다음
                </a>

            </li>

        </ul>

    </nav>

</div>
<script>
    const categoryLis = document.getElementsByClassName("categoryLi");
    const transCategory = document.getElementById("transCategory");
    const categoryBtn = document.getElementById("categoryBtn");
    for(let i = 0 ; i < categoryLis.length ; i++){
        categoryLis[i].addEventListener("click",function(){
            transCategory.value = categoryLis[i].children[0].dataset.id;
            categoryBtn.innerHTML = categoryLis[i].children[0].text;
        });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
